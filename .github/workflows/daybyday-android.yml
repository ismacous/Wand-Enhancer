name: DayByDay Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "DayByDay/**"
      - ".github/workflows/daybyday-android.yml"

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests
        working-directory: DayByDay
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        working-directory: DayByDay
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        working-directory: DayByDay
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/DayByDay.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: DayByDay-apk
          path: DayByDay/artifacts/DayByDay.apk
          if-no-files-found: error

  instrumented:
    name: Emulator tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          working-directory: DayByDay
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DayByDay-test-reports
          path: DayByDay/app/build/reports/androidTests/
          if-no-files-found: ignore
